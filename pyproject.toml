[project]
name = "ptcg-rl"
version = "0.1.0"
description = "RL training and data tooling for the Pokemon TCG AI Battle Kaggle contest."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "hydra-core>=1.3",
    "lightning>=2.2",
    "loguru>=0.7",
    "msgpack>=1.0",
    "numpy>=1.24",
    "orjson>=3.10",
    "pydantic>=2",
    "pyarrow>=15",
    "pyzmq>=25",
    "tensorboard>=2.15",
    "trueskill==0.4.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptcg_rl = ["**/*.csv", "**/*.html", "**/*.css", "**/*.js", "**/*.json"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/ptcg_rl/opponents/public_agents/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ptcg_rl"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
exclude = [
    "^data/",
    "^outputs/",
    "^dist/",
    "^src/ptcg_rl/opponents/public_agents/",
]
untyped_calls_exclude = ["pyarrow"]

[[tool.mypy.overrides]]
module = [
    "hydra.*",
    "lightning.*",
    "msgpack.*",
    "omegaconf.*",
    "orjson.*",
    "pyarrow.*",
    "trueskill.*",
    "zmq.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = ["third_party"]
